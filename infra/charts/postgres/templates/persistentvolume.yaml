apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "postgres.name" . }}-pv
  labels:
    type: local
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  storageClassName: {{ .Values.storage.className }}
  capacity:
    storage: {{ .Values.storage.capacity }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ .Values.storage.hostPath }}
