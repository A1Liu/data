server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed assets emitted by Vite.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # In-cluster equivalent of the vite dev proxy: the SPA calls /trpc, the api
  # chart serves it. Resolved at request time (not startup) so nginx boots even
  # when the api Service isn't up yet.
  location /trpc/ {
    resolver kube-dns.kube-system.svc.cluster.local valid=10s;
    set $api "http://api:8080";
    proxy_pass $api$request_uri;
    proxy_set_header Host $host;
  }

  # SPA fallback: any unknown path returns index.html so the client router can resolve it.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
